[project]
name = "swagger2krakend"
version = "1.1.0"
requires-python = ">=3.9"
dependencies = ["PyYAML", "Jinja2"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff", "black"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
